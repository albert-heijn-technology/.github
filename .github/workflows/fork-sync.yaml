---
name: Fork sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: token
        with:
          client-id: ${{ vars.OSPO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OSPO_AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Sync forks
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          status=0
          while read -r repo; do
            echo "Syncing ${repo}"
            if ! gh api -X POST "/repos/${repo}/merge-upstream" -f branch=main; then
              echo "::error::Failed to sync ${repo}"
              status=1
            fi
          done < <(gh api "/orgs/${OWNER}/repos" --paginate \
            --jq '.[] | select(.fork == true) | .full_name')
          exit "${status}"
