---
name: Fork sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: token
        with:
          client-id: ${{ vars.OSPO_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OSPO_AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Sync forks
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # merge-upstream returns 422 "Repository rule violations found" because that
          # endpoint doesn't honor the org ruleset's bypass entry for this GitHub App,
          # unlike a plain ref update. Replicate the fast-forward manually instead.
          status=0
          while read -r repo; do
            echo "Syncing ${repo}"
            parent=$(gh api "/repos/${repo}" --jq '.parent.full_name')
            branch=$(gh api "/repos/${repo}" --jq '.default_branch')
            if [ -z "${parent}" ] || [ "${parent}" = "null" ]; then
              echo "::error::${repo} has no upstream parent"
              status=1
              continue
            fi
            # Read the upstream tip via plain git (no API call) since the app's
            # installation token has no access to external/upstream repos, even
            # public ones.
            upstream_sha=$(git ls-remote "https://github.com/${parent}.git" "refs/heads/${branch}" | cut -f1)
            if [ -z "${upstream_sha}" ]; then
              echo "::error::Could not resolve upstream SHA for ${repo}"
              status=1
              continue
            fi
            if ! gh api -X PATCH "/repos/${repo}/git/refs/heads/${branch}" \
              -f sha="${upstream_sha}" -F force=false >/dev/null; then
              echo "::error::Failed to sync ${repo}"
              status=1
            fi
          done < <(gh api "/orgs/${OWNER}/repos" --paginate \
            --jq '.[] | select(.fork == true) | .full_name')
          exit "${status}"
